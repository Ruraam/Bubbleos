[package]
name = "bubble-theme-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Wallpaper-driven semantic theme generation for BubbleOS"
license = "MIT"

[[bin]]
name = "bubble-theme"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
