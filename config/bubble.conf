# bubbleOS system configuration
BUBBLEOS_NAME="bubbleOS"
BUBBLEOS_VERSION="0.0.1-dev"
BUBBLEOS_CHANNEL="development"
BUBBLEOS_STATE_DIR="/var/lib/bubbleos"
BUBBLEOS_CONFIG_DIR="/etc/bubbleos"
BUBBLEOS_CACHE_DIR="/var/cache/bubbleos"
BUBBLEOS_RUN_DIR="/run/bubbleos"
BUBBLEOS_ROOTFS_MOUNT="/var/lib/bubbleos/rootfs"
BUBBLEOS_SNAPSHOTS_DIR="/snapshots"
BUBBLEOS_GENERATIONS_DIR="/var/lib/bubbleos/rootfs/generations"
BUBBLEOS_CURRENT_LINK="/var/lib/bubbleos/rootfs/current"
BUBBLEOS_PREVIOUS_LINK="/var/lib/bubbleos/rootfs/previous"
BUBBLEOS_SNAPSHOT_KEEP="${BUBBLEOS_SNAPSHOT_KEEP:-10}"
BUBBLEOS_ULPM_DIR="/opt/bubbleos/ulpm"
